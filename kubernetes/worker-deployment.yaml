apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: resiliencelab
  labels:
    app: resiliencelab-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resiliencelab-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: resiliencelab-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: resiliencelab-worker:v1
          imagePullPolicy: Never  # Use local Docker images (Minikube)
          ports:
            - containerPort: 8001
              name: metrics
          envFrom:
            - configMapRef:
                name: resiliencelab-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resiliencelab-secrets
                  key: POSTGRES_PASSWORD
          # Worker readiness: can it reach the DB?
          # Worker does not serve HTTP traffic, so readiness probe
          # is less critical, but we still check its metrics endpoint.
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
