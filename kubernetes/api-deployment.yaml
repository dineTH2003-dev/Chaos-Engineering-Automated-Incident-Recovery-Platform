apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: resiliencelab
  labels:
    app: resiliencelab-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resiliencelab-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: resiliencelab-api
        chaos-enabled: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: resiliencelab-api:v1
          imagePullPolicy: Never  # Use local Docker images (Minikube)
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: resiliencelab-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resiliencelab-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5  # Tolerant — avoid unnecessary restarts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
