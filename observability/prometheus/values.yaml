# ResilienceLab — Tuned kube-prometheus-stack Helm values
# Optimized for local Minikube development (~3.5GB RAM node)

# Global configuration
global:
  rbac:
    create: true

# Disable scraping of components that fail or are not applicable in single-node Minikube
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

# Prometheus Operator configuration
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

# Prometheus Server configuration
prometheus:
  prometheusSpec:
    # Important: Allow discovering ServiceMonitors and PodMonitors across ALL namespaces (especially resiliencelab)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # ServiceMonitor and Rule namespace selectors (all namespaces)
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

    # TSDB retention settings for resource efficiency
    retention: 24h
    retentionSize: 2GiB

    # Resource requests and limits tailored for local laptop
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 750Mi

# Alertmanager configuration
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    global:
      resolve_timeout: 2m
    route:
      group_by: ['alertname', 'namespace', 'job', 'severity']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 2h
      receiver: 'webhook-receiver'
      routes:
        - receiver: 'webhook-receiver'
          continue: false
    receivers:
      - name: 'webhook-receiver'
        webhook_configs:
          - url: 'http://webhook-receiver.resiliencelab.svc.cluster.local:5001/alerts'
            send_resolved: true
            http_config:
              follow_redirects: true

# Grafana configuration
grafana:
  enabled: true
  adminPassword: "prom-operator"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  # Automatic discovery of dashboard ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: "grafana_dashboard"
      labelValue: "1"
      searchNamespace: "ALL"
      folder: "/tmp/dashboards"
      provider:
        allowUiUpdates: true
        folder: "ResilienceLab"

# Node Exporter (DaemonSet for host/node metrics)
nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 30Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Kube State Metrics (metrics about K8s objects: pods, deployments, etc.)
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 128Mi
