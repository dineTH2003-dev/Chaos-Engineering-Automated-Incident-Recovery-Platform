{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.global.namespace }}
  labels:
    app: resiliencelab-worker
    {{- include "resiliencelab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: resiliencelab-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.worker.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.worker.rollingUpdate.maxSurge }}
  template:
    metadata:
      labels:
        app: resiliencelab-worker
        chaos-enabled: "true"
        {{- include "resiliencelab.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8001
              name: metrics
          envFrom:
            - configMapRef:
                name: resiliencelab-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resiliencelab-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probes.readiness.path }}
              port: 8001
            initialDelaySeconds: {{ .Values.worker.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probes.liveness.path }}
              port: 8001
            initialDelaySeconds: {{ .Values.worker.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
