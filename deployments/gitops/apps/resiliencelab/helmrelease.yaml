apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: resiliencelab
  namespace: resiliencelab
  labels:
    app.kubernetes.io/part-of: resiliencelab
spec:
  interval: 5m
  chart:
    spec:
      chart: ./deployments/helm/resiliencelab
      sourceRef:
        kind: GitRepository
        name: resiliencelab
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: enabled
  values:
    global:
      namespace: resiliencelab
      imagePullPolicy: IfNotPresent
    api:
      replicaCount: 2
      image:
        repository: resiliencelab-api
        tag: "c49d3e3"
        pullPolicy: IfNotPresent
    worker:
      replicaCount: 1
      image:
        repository: resiliencelab-worker
        tag: "c49d3e3"
        pullPolicy: IfNotPresent
    config:
      logLevel: DEBUG
      workerLogLevel: DEBUG
      workerPollIntervalSeconds: "5"
