apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: resiliencelab
  namespace: resiliencelab
  labels:
    app.kubernetes.io/part-of: resiliencelab
spec:
  interval: 5m
  chart:
    spec:
      chart: ./deployments/helm/resiliencelab
      sourceRef:
        kind: GitRepository
        name: resiliencelab
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  valuesFiles:
    - ./deployments/helm/environments/development/values.yaml
